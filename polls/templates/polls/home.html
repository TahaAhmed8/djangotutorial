<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>

<body>

    <h1>Our Products</h1>

    {% for product in products %}

        <h2>{{ product.name }}</h2>

        <p>Price: ₹{{ product.price }}</p>

        <p>{{ product.description }}</p>

        <hr>

    {% endfor %}

</body>
</html>
